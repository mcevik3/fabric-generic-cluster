site_topology_nodes:
  nodes:
    node1:
      name: vm-a
      hostname: vm-a
      site: SRI
      worker: ''
      capacity:
        cpu: 2
        ram: 4
        disk: 20
        os: default_rocky_9
      pci:
        dpu: {}
        fpga:
          fpga1:
            name: fpga1
            model: FPGA_Xilinx_U280
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: data
        gpu: {}
        nvme: {}
        network: {}
      persistent_storage:
        volume: {}
      specific:
        openstack:
          control: 'false'
          network: 'false'
          compute: 'false'
          storage: 'false'
    node2:
      name: peer
      hostname: peer
      site: SRI
      worker: ''
      capacity:
        cpu: 2
        ram: 4
        disk: 20
        os: default_rocky_9
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: data
      persistent_storage:
        volume: {}
      specific:
        openstack:
          control: 'false'
          network: 'false'
          compute: 'false'
          storage: 'false'
site_topology_networks:
  networks:
    net1:
      name: data
      type: L2Bridge
site_topology_facility_ports:
  facility_ports: {}
